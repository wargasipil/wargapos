syntax = "proto3";

package wargapos.notification.v1;

import "google/protobuf/timestamp.proto";

option go_package = "wargapos/backend/gen/wargapos/notification/v1;notificationv1";

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TYPE_ORDER_PLACED = 1;
  NOTIFICATION_TYPE_ORDER_PREPARED = 2;
  NOTIFICATION_TYPE_ORDER_DELIVERED = 3;
  NOTIFICATION_TYPE_ORDER_PAID = 4;
  NOTIFICATION_TYPE_ORDER_CANCELLED = 5;
}

message Notification {
  int64 id = 1;
  NotificationType type = 2;
  string title = 3;
  string body = 4;
  int64 order_id = 5;
  google.protobuf.Timestamp created_at = 6;
  bool is_read = 7;
}

message SubscribeRequest {}

message ListNotificationsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  int32 total = 2;
}

message MarkAllReadRequest {}
message MarkAllReadResponse {}

service NotificationService {
  // rpc Subscribe(SubscribeRequest) returns (stream NotificationRequest);
  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);
  rpc MarkAllRead(MarkAllReadRequest) returns (MarkAllReadResponse);
}
