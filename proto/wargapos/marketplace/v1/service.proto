syntax = "proto3";

package wargapos.marketplace.v1;

import "buf/validate/validate.proto";
import "wargapos/marketplace/v1/product.proto";
import "wargapos/marketplace/v1/shop.proto";
import "wargapos/rolebased/v1/role.proto";

option go_package = "wargapos/backend/gen/wargapos/marketplace/v1;marketplacev1";

service MarketplaceService {
  // Shop CRUD
  rpc CreateShop(CreateShopRequest) returns (CreateShopResponse);
  rpc GetShop(GetShopRequest) returns (GetShopResponse);
  rpc UpdateShop(UpdateShopRequest) returns (UpdateShopResponse);
  rpc DeleteShop(DeleteShopRequest) returns (DeleteShopResponse);
  rpc ListShops(ListShopsRequest) returns (ListShopsResponse);
  // Products
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc DeleteProduct(DeleteProductRequest) returns (DeleteProductResponse);
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  rpc RestockProduct(RestockProductRequest) returns (RestockProductResponse);
}

// --- Shop messages ---

message CreateShopRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
  string name = 1;
  MarketplaceShopType type = 2;
  string username = 3;
  string url = 4;
}
message CreateShopResponse {
  MarketplaceShop shop = 1;
}

message GetShopRequest {
  uint64 id = 1;
}
message GetShopResponse {
  MarketplaceShop shop = 1;
}

message UpdateShopRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
  uint64 id = 1;
  string name = 2;
  MarketplaceShopType type = 3;
  string username = 4;
  string url = 5;
  bool is_active = 6;
}
message UpdateShopResponse {
  MarketplaceShop shop = 1;
}

message DeleteShopRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
  uint64 id = 1;
}
message DeleteShopResponse {}

message ListShopsRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  bool active_only = 4;
}
message ListShopsResponse {
  repeated MarketplaceShop shops = 1;
  int32 total = 2;
}

// --- Product messages ---

message CreateProductRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_WAREHOUSE_ADMIN
    ]
  };
  string name = 1;
  string description = 2;
  int64 price_cents = 3;
  string image_url = 4;
}
message CreateProductResponse {
  MarketplaceProduct product = 1;
}

message GetProductRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_ACCOUNTANT,
      ROLE_WAREHOUSE_ADMIN
    ]
  };
  uint64 id = 1;
}
message GetProductResponse {
  MarketplaceProduct product = 1;
}

message UpdateProductRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_WAREHOUSE_ADMIN
    ]
  };
  uint64 id = 1;
  string name = 2;
  string description = 3;
  int64 price_cents = 4;
  string image_url = 5;
  bool is_active = 6;
}
message UpdateProductResponse {
  MarketplaceProduct product = 1;
}

message DeleteProductRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_WAREHOUSE_ADMIN
    ]
  };
  uint64 id = 1;
}
message DeleteProductResponse {}

message RestockProductRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_WAREHOUSE_ADMIN
    ]
  };
  uint64 product_id = 1;
  uint32 warehouse_id = 2;
  int32 delta = 3;
  double total = 4 [(buf.validate.field).double.gt = 0];
}

message RestockProductResponse {
  MarketplaceProduct product = 1;
}

message ListProductsRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN,
      ROLE_ACCOUNTANT,
      ROLE_WAREHOUSE_ADMIN
    ]
  };
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  bool active_only = 4;
}
message ListProductsResponse {
  repeated MarketplaceProduct products = 1;
  int32 total = 2;
}
