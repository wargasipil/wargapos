syntax = "proto3";

package wargapos.marketplace.v1;

import "google/protobuf/timestamp.proto";

option go_package = "wargapos/backend/gen/wargapos/marketplace/v1;marketplacev1";

enum MarketplaceOrderStatus {
  MARKETPLACE_ORDER_STATUS_UNSPECIFIED = 0;
  MARKETPLACE_ORDER_STATUS_PENDING = 1;
  MARKETPLACE_ORDER_STATUS_CANCELLED = 2;
  MARKETPLACE_ORDER_STATUS_COMPLETED = 3;
}

message MarketplaceOrderItem {
  uint64 id = 1;
  string item_name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
  int64 subtotal_cents = 5;
}

message MarketplaceOrder {
  uint64 id = 1;
  uint64 shop_id = 2;
  string shop_name = 3;
  string customer_name = 4;
  string phone_number = 5;
  repeated MarketplaceOrderItem items = 6;
  int64 total_cents = 7;
  MarketplaceOrderStatus status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  uint32 warehouse_id = 11;
  uint64 customer_id = 12;
  uint64 address_id = 13;
  string shipping_label = 14;
  string shipping_address = 15;
  string shipping_city = 16;
  string shipping_province = 17;
  string shipping_postal_code = 18;
  string note = 19;
  string receipt = 20;
  string receipt_file = 21;
}
