syntax = "proto3";

package wargapos.auth.v1;

import "buf/validate/validate.proto";

option go_package = "wargapos/backend/gen/wargapos/auth/v1;authv1";

message LoginRequest {
  string username = 1 [(buf.validate.field).string.min_len = 1];
  string password = 2 [(buf.validate.field).string.min_len = 1];
}

message LoginResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_at    = 3;
}

message LogoutRequest {
  string access_token = 1 [(buf.validate.field).string.min_len = 1];
}

message LogoutResponse {}

message ValidateTokenRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}

message ValidateTokenResponse {
  bool   valid   = 1;
  int64  user_id = 2;
  string role    = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
}

message RefreshTokenResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int64  expires_at    = 3;
}

service AuthService {
  rpc Login(LoginRequest)                   returns (LoginResponse);
  rpc Logout(LogoutRequest)                 returns (LogoutResponse);
  rpc ValidateToken(ValidateTokenRequest)   returns (ValidateTokenResponse);
  rpc RefreshToken(RefreshTokenRequest)     returns (RefreshTokenResponse);
}
