syntax = "proto3";

package wargapos.product.v1;

option go_package = "wargapos/backend/gen/wargapos/product/v1;productv1";

message Category {
  int64  id   = 1;
  string name = 2;
}

message Product {
  int64  id          = 1;
  string name        = 2;
  string description = 3;
  int64  category_id = 4;
  int64  price_cents = 5;
  bool   is_active   = 6;
  string sku         = 7;
  string image_url   = 8;
  int64  cogs_cents  = 9;
  int32  stock_qty   = 10;
}

message CreateProductRequest {
  string name        = 1;
  string description = 2;
  int64  category_id = 3;
  int64  price_cents = 4;
  string sku         = 5;
  string image_url   = 6;
  int64  cogs_cents  = 7;
}

message CreateProductResponse { Product product = 1; }

message GetProductRequest  { int64 id = 1; }
message GetProductResponse { Product product = 1; }

message ListProductsRequest {
  int32  page          = 1;
  int32  page_size     = 2;
  int64  category_id   = 3;
  bool   active_only   = 4; // when true, only return is_active=true products
  bool   inactive_only = 5; // when true, only return is_active=false products
  string search        = 6; // filter by name (case-insensitive, partial match)
}

message ListProductsResponse {
  repeated Product products = 1;
  int32            total    = 2;
}

message UpdateProductRequest {
  int64  id          = 1;
  string name        = 2;
  int64  price_cents = 3;
  bool   is_active   = 4;
  string image_url   = 5;
  string description = 6;
  string sku         = 7;
  int64  category_id = 8;
  int64  cogs_cents  = 9;
}

message UpdateProductResponse { Product product = 1; }

message DeleteProductRequest  { int64 id = 1; }
message DeleteProductResponse {}

message CreateCategoryRequest  { string name = 1; }
message CreateCategoryResponse { Category category = 1; }

message UpdateCategoryRequest  { int64 id = 1; string name = 2; }
message UpdateCategoryResponse { Category category = 1; }

message DeleteCategoryRequest  { int64 id = 1; }
message DeleteCategoryResponse {}

message ListCategoriesRequest  {}
message ListCategoriesResponse { repeated Category categories = 1; }

service ProductService {
  rpc CreateProduct(CreateProductRequest)   returns (CreateProductResponse);
  rpc GetProduct(GetProductRequest)         returns (GetProductResponse);
  rpc ListProducts(ListProductsRequest)     returns (ListProductsResponse);
  rpc UpdateProduct(UpdateProductRequest)   returns (UpdateProductResponse);
  rpc DeleteProduct(DeleteProductRequest)   returns (DeleteProductResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
}
