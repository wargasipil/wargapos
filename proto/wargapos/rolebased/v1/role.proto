syntax = "proto3";

package wargapos.rolebased.v1;

import "google/protobuf/descriptor.proto";

option go_package = "wargapos/backend/gen/wargapos/rolebased/v1;rolebasedv1";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ROOT = 1;
  ROLE_ADMIN = 2;
  ROLE_ACCOUNTANT = 3;
  ROLE_CASHIER = 4;
  ROLE_WAREHOUSE_ADMIN = 5;
  ROLE_WAREHOUSE_MEMBER = 6;
}

enum IdentityType {
  IDENTITY_TYPE_UNSPECIFIED = 0;
  IDENTITY_TYPE_SYSTEM = 1;
  IDENTITY_TYPE_GENERAL_USER = 2;
}

message Identity {
  uint32 identity_id = 1;
  Role role = 2;
  IdentityType identity_type = 3;
  string agent = 4;
}

message RequestPolicy {
  repeated Role roles = 1;
  bool allow_authenticated = 2;
  bool allow_public = 3;
}

extend google.protobuf.MessageOptions {
  RequestPolicy request_policy = 50001;
}
