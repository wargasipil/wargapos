syntax = "proto3";

package wargapos.settings.v1;

import "google/protobuf/timestamp.proto";
import "wargapos/rolebased/v1/role.proto";

option go_package = "wargapos/backend/gen/wargapos/settings/v1;settingsv1";

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
}

enum BusinessType {
  BUSINESS_TYPE_UNSPECIFIED = 0;
  BUSINESS_TYPE_CAFE = 1;
  BUSINESS_TYPE_MARKETPLACE = 2;
}

message MidtransSettings {
  string server_key = 1;
  string client_key = 2;
  string environment = 3; // "sandbox" | "production"
}

message GetSettingsRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
}
message ManualPaymentSettings {
  string bank_name = 1;
  string bank_account_number = 2;
  string bank_account_name = 3;
  string qris_image_url = 4;
}

enum PrintMode {
  PRINT_MODE_UNSPECIFIED = 0; // behaves as CONNECTOR (backwards compatible)
  PRINT_MODE_CONNECTOR = 1;
  PRINT_MODE_BROWSER = 2;
}

message PrinterSettings {
  string title = 1;
  string description = 2;
  string address = 3;
  string address2 = 4;
  string contact = 5;
  string footer = 6;
  PrintMode print_mode = 7;
}

message GetSettingsResponse {
  MidtransSettings midtrans = 1;
  bool midtrans_configured = 2; // true when server_key is non-empty
  ManualPaymentSettings manual_payment = 3;
  PrinterSettings printer = 4;
  BackupSettings backup = 5;
  BusinessType business_type = 6;
}

message BackupSettings {
  bool enabled = 1;
  int32 interval_hours = 2;
  int32 retention_count = 3;
  string backup_dir = 4;
  google.protobuf.Timestamp last_backup_at = 5;
}

message UpdateSettingsRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
  MidtransSettings midtrans = 1;
  ManualPaymentSettings manual_payment = 2;
  PrinterSettings printer = 3;
  BackupSettings backup = 4;
  BusinessType business_type = 7;
}
message UpdateSettingsResponse {}
