syntax = "proto3";

package wargapos.user.v1;

import "buf/validate/validate.proto";

option go_package = "wargapos/backend/gen/wargapos/user/v1;userv1";

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_ADMIN       = 1;
  ROLE_CASHIER     = 2;
  ROLE_MANAGER     = 3;
}

message User {
  int64  id        = 1;
  string username  = 2;
  string full_name = 3;
  string email     = 4;
  Role   role      = 5;
  bool   is_active = 6;
  string image_url = 7;
}

message CreateUserRequest {
  string username  = 1 [(buf.validate.field).string = {min_len: 3, max_len: 50}];
  string full_name = 2 [(buf.validate.field).string.min_len = 1];
  string email     = 3 [(buf.validate.field).string.email = true];
  string password  = 4 [(buf.validate.field).string.min_len = 6];
  Role   role      = 5 [(buf.validate.field).enum = {not_in: [0]}];
}

message CreateUserResponse { User user = 1; }

message GetUserRequest  { int64 id = 1 [(buf.validate.field).int64.gt = 0]; }
message GetUserResponse { User user = 1; }

message UpdateUserRequest {
  int64  id        = 1 [(buf.validate.field).int64.gt = 0];
  string full_name = 2;
  string email     = 3;
  Role   role      = 4;
  bool   is_active = 5;
}

message UpdateUserResponse { User user = 1; }

message DeleteUserRequest  { int64 id = 1 [(buf.validate.field).int64.gt = 0]; }
message DeleteUserResponse {}

message ListUsersRequest {
  int32 page      = 1;
  int32 page_size = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  int32         total = 2;
}

message ChangePasswordRequest {
  string current_password = 1 [(buf.validate.field).string.min_len = 1];
  string new_password     = 2 [(buf.validate.field).string.min_len = 6];
}
message ChangePasswordResponse {}

service UserService {
  rpc CreateUser(CreateUserRequest)       returns (CreateUserResponse);
  rpc GetUser(GetUserRequest)             returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest)       returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest)       returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest)         returns (ListUsersResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}
