syntax = "proto3";

package wargapos.user.v1;

import "buf/validate/validate.proto";
import "wargapos/rolebased/v1/role.proto";

option go_package = "wargapos/backend/gen/wargapos/user/v1;userv1";

message User {
  uint32 id = 1;
  string username = 2;
  string full_name = 3;
  string email = 4;
  wargapos.rolebased.v1.Role role = 5;
  bool is_active = 6;
  string image_url = 7;
}

message CreateUserRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
  string username = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 50
  }];
  string full_name = 2 [(buf.validate.field).string.min_len = 1];
  string email = 3 [(buf.validate.field).string.email = true];
  string password = 4 [(buf.validate.field).string.min_len = 6];
  wargapos.rolebased.v1.Role role = 5 [(buf.validate.field).enum = {
    not_in: [0]
  }];
}
message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  option (wargapos.rolebased.v1.request_policy) = {allow_authenticated: true};
  repeated uint32 ids = 1 [(buf.validate.field).repeated.min_items = 1];
}
message GetUserResponse {
  map<uint32, User> users = 1;
}

message UpdateUserRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
  string full_name = 2;
  string email = 3;
  wargapos.rolebased.v1.Role role = 4;
  bool is_active = 5;
}
message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
  uint32 id = 1 [(buf.validate.field).uint32.gt = 0];
}
message DeleteUserResponse {}

message ListUsersRequest {
  option (wargapos.rolebased.v1.request_policy) = {
    roles: [
      ROLE_ROOT,
      ROLE_ADMIN
    ]
  };
  int32 page = 1;
  int32 page_size = 2;
}
message ListUsersResponse {
  repeated User users = 1;
  int32 total = 2;
}

message ChangePasswordRequest {
  string current_password = 1 [(buf.validate.field).string.min_len = 1];
  string new_password = 2 [(buf.validate.field).string.min_len = 6];
}
message ChangePasswordResponse {}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}
