name: Release Server

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Build Windows server
        run: |
          mkdir -p dist/server
          cd backend
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" \
            -o ../dist/server/wargapos-server.exe ./cmd/server
          cd ..
          cp backend/cmd/server/config.yaml.example dist/server/
          cd dist && zip -r "../dist/wargapos-server-${{ github.ref_name }}-windows-amd64.zip" server/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wargapos-server-${{ github.ref_name }}-windows-amd64.zip
          generate_release_notes: false
          body: |
            ## WargaPOS Server ${{ github.ref_name }}

            Standalone Windows server binary with embedded frontend.
            Use this when you already have PostgreSQL installed separately.
            For a fully self-contained installer (PostgreSQL bundled), download **wargapos-setup-*.exe** instead.

            ### Quick Start
            1. Extract the zip
            2. Copy `config.yaml.example` → `config.yaml` and edit (DB URL + JWT secret)
            3. Run `wargapos-server.exe` (or via command prompt / Windows service)

            ### Config (`config.yaml`)
            All fields can also be set via environment variables:
            `DATABASE_URL`, `JWT_SECRET`, `SERVER_PORT`, etc.
